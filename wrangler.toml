name = "myuuai"
main = "worker.js"
compatibility_date = "2026-11-26"

# Frontend dashboard disajikan sebagai static assets.
# Hanya request /api/* yang masuk ke Worker backend.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Workers AI untuk subtitle otomatis (Whisper)
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "*"

# Secrets disimpan di Cloudflare Dashboard, bukan di file ini:
# MAGIC_HOUR_API_KEY   (sudah dipasang; satu key)
# MAGIC_HOUR_API_KEYS  (opsional; beberapa key dipisahkan koma/baris baru)
# APP_ACCESS_TOKEN    (opsional)
# ELEVENLABS_API_KEY  (opsional, sound effects)
